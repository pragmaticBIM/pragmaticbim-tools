    note:
      de: Prüft nur den Wärmeschutz (U-Werte); Schallschutz nicht abgedeckt.
      fr: Vérifie uniquement la protection thermique (valeurs U); protection acoustique non couverte.
      it: Verifica solo la protezione termica (valori U); protezione acustica non coperta.
      en: Checks thermal insulation only (U-values); sound insulation not covered.
