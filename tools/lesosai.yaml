description:
  de: Energie- und Ökobilanzsoftware für SIA 380/1, Minergie und graue Energie nach SIA 2032, mit IFC- und gbXML-Import.
  fr: Logiciel énergie et écobilan pour SIA 380/1, Minergie et énergie grise selon SIA 2032, import IFC et gbXML.
