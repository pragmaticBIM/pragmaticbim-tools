      en: Record and evaluate own projects; map BKP costs to eBKP-H.
  - code: BES-IPD
    note:
      de: Referenzkosten und Kennwerte abgerechneter Schweizer Bauten nach eBKP-H und BKP.
      fr: Coûts de référence et valeurs d'objets suisses décomptés selon eBKP-H et CFC.
      it: Costi di riferimento e parametri di edifici svizzeri liquidati secondo eBKP-H e CCC.
      en: Reference costs and benchmarks of completed Swiss buildings by eBKP-H and BKP.
  - code: DES-ELEMENT-COST-EARLY
    note:
      de: Kosten aus dem 3D-Modell mit eBKP-H-Kalkulator und BFS-Kennwerten.
