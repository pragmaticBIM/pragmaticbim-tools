description:
  de: Kennwerte von über 1000 abgerechneten Schweizer Bauten nach eBKP-H, BKP und SIA 416, mit Objektvergleich.
  fr: Valeurs de référence de plus de 1000 bâtiments suisses décomptés selon eBKP-H, BKP et SIA 416, avec comparaison d'objets.
  it: Parametri di oltre 1000 edifici svizzeri liquidati secondo eBKP-H, BKP e SIA 416, con confronto tra oggetti.
  en: Benchmarks from over 1000 completed Swiss buildings by eBKP-H, BKP and SIA 416, with project comparison.
use_cases:
  - code: BES-ELEMENT-COST-POSTCALC
    note:
      de: Eigene Projekte erfassen und auswerten; BKP-Kosten auf eBKP-H umschlüsseln.
      fr: Saisir et évaluer ses propres projets; convertir les coûts CFC en eBKP-H.
