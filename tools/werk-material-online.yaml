      it: Confronto con oggetti consuntivati secondo indicatori di costi, superfici ed energia.
      en: Comparison with completed projects by cost, area and energy benchmarks.
  - code: QAS-COST-PLAUS
    note:
      de: NPK-Einheitspreise und Elementkennwerte des BFS als Vergleichswerte.
      fr: Prix unitaires NPK et valeurs de référence par élément de l'OFS comme valeurs de comparaison.
